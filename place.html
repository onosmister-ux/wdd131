<!DOCTYPE html>

<meta name="description" content="Explore Madagascar including its population, culture, geography, and weather conditions in this responsive country webpage project.">

<!-- GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="scripts/place.js" defer></script>

<h1>Madagascar</h1>
</header>

<main>

<section class="hero">

<source srcset="images/hero-large.jpg" media="(min-width:768px)">
<img src="images/hero-small.jpg" alt="Lemurs in Madagascar">
</picture>
</section>

<!-- DATA -->
<section class="data">
<h2>Data</h2>

<p><strong>Area:</strong> 587,041 sq km</p>
<p><strong>Population:</strong> 27,691,018</p>

<p><strong>Calling Code:</strong> +261</p>
<p><strong>Internet TLD:</strong> .mg</p>
</section>

<!-- WEATHER -->
<section class="weather">
<h2>Weather</h2>

<img src="images/weather.svg" alt="weather icon">

<p>Temperature: <span id="temp">10</span> °C</p>
<p>Wind: <span id="wind">5</span> km/h</p>

</section>

</main>

<footer>
<p>© <span id="year"></span> | Onos Adu | Madagascar</p>
