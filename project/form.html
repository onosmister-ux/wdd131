<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Product Review Form">
  <meta name="author" content="onos adu">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="form-styles.css">
</head>

<body>

<header>
  <h1>Product Review Form</h1>
</header>

<main>
  <form method="get" action="review.html">

    <label for="product">Product Name</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <fieldset>
      <legend>Overall Rating</legend>
      <label><input type="radio" id="r1" name="rating" value="1" required> ☆</label>
      <label><input type="radio" id="r2" name="rating" value="2"> ☆☆</label>
      <label><input type="radio" id="r3" name="rating" value="3"> ☆☆☆</label>
      <label><input type="radio" id="r4" name="rating" value="4"> ☆☆☆☆</label>
      <label><input type="radio" id="r5" name="rating" value="5"> ☆☆☆☆☆</label>
    </fieldset>

    <label for="installDate">Date of Installation</label>
    <input type="date" id="installDate" name="installDate" required>

    <fieldset>
      <legend>Useful Features</legend>
      <label><input type="checkbox" id="f1" name="features" value="Speed"> Speed</label>
      <label><input type="checkbox" id="f2" name="features" value="Durability"> Durability</label>
      <label><input type="checkbox" id="f3" name="features" value="Efficiency"> Efficiency</label>
      <label><input type="checkbox" id="f4" name="features" value="Design"> Design</label>
    </fieldset>

    <label for="review">Written Review</label>
    <textarea id="review" name="review" rows="4"></textarea>

    <label for="username">Your Name</label>
    <input type="text" id="username" name="username">

    <input type="submit" value="Submit Review">

  </form>
</main>

<footer>
  <p>&copy; 2026 onos adu</p>
</footer>

<script src="script.js"></script>

</body>
</html>
