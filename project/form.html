<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Submit your product review by rating features, sharing your experience, and providing feedback on product performance and usability.">
  <meta name="author" content="onos adu">

  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
  <script src="scripts/products.js" defer></script>
</head>

<body>

<header>
  <h1>Product Review Form</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="form.html">Review</a>
  </nav>
</header>

<main>
  <form method="get" action="review.html">

    <!-- Product -->
    <label for="product">Product Name</label>
    <select id="product" name="product" required>
      <option value="" disabled selected>Select a Product ...</option>
    </select>

    <!-- Rating -->
    <fieldset>
      <legend>Overall Rating</legend>

      <input type="radio" id="r1" name="rating" value="1" required>
      <label for="r1">☆</label>

      <input type="radio" id="r2" name="rating" value="2" required>
      <label for="r2">☆☆</label>

      <input type="radio" id="r3" name="rating" value="3" required>
      <label for="r3">☆☆☆</label>

      <input type="radio" id="r4" name="rating" value="4" required>
      <label for="r4">☆☆☆☆</label>

      <input type="radio" id="r5" name="rating" value="5" required>
      <label for="r5">☆☆☆☆☆</label>

    </fieldset>

    <!-- Date -->
    <label for="installDate">Date of Installation</label>
    <input type="date" id="installDate" name="installDate" required>

    <!-- Features -->
    <fieldset>
      <legend>Useful Features</legend>

      <input type="checkbox" id="f1" name="features" value="Speed">
      <label for="f1">Speed</label>

      <input type="checkbox" id="f2" name="features" value="Durability">
      <label for="f2">Durability</label>

      <input type="checkbox" id="f3" name="features" value="Efficiency">
      <label for="f3">Efficiency</label>

      <input type="checkbox" id="f4" name="features" value="Design">
      <label for="f4">Design</label>

    </fieldset>

    <!-- Review -->
    <label for="review">Written Review</label>
    <textarea id="review" name="review" rows="4"></textarea>

    <!-- Name -->
    <label for="username">Your Name</label>
    <input type="text" id="username" name="username">

    <!-- Submit -->
    <input type="submit" value="Submit Review">

  </form>
</main>

<footer>
  <a href="references.html">References</a>
  <p>&copy; 2026 onos adu</p>
</footer>

<script src="scripts/script.js" defer></script>
</body>
</html>
